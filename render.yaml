# Deploy satu klik di Render: New → Blueprint → pilih repo ini
services:
  - type: web
    name: seanav-operations
    runtime: docker
    plan: starter
    healthCheckPath: /login/
    disk:
      name: media
      mountPath: /app/media
      sizeGB: 2
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: seanav-db
          property: connectionString
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
databases:
  - name: seanav-db
    plan: basic-256mb
    databaseName: seanav
